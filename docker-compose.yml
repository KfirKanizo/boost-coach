services:
  db:
    image: postgres:16-alpine
    container_name: boostcoach_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boostcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boostcoach}
      POSTGRES_DB: ${POSTGRES_DB:-boostcoach}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boostcoach} -d ${POSTGRES_DB:-boostcoach}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boostcoach_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boostcoach}:${POSTGRES_PASSWORD:-boostcoach}@db:5432/${POSTGRES_DB:-boostcoach}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
