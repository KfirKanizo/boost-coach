# BoostCoach production reverse proxy — routes traffic for fit.idone.co.il.
#
# Host ports 80/443 are owned by the existing n8n stack, so this proxy listens
# on 8080 (HTTP) and 8443 (HTTPS). TLS is issued via the Let's Encrypt DNS-01
# challenge (no port 80, no webroot). HTTPS is mandatory: Capacitor's WebView
# requires a secure context for the camera API (getUserMedia).

upstream api_upstream {
    server api:8000;
}

# HTTP on 8080: just redirect to HTTPS.
server {
    listen 8080;
    server_name fit.idone.co.il;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS on 8443
server {
    listen 8443 ssl;
    server_name fit.idone.co.il;

    ssl_certificate     /etc/letsencrypt/live/fit.idone.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.idone.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # ── Content Security Policy ─────────────────────────────────────────
    # Must mirror the <meta> CSP in frontend/index.html so HTTP headers
    # don't override it.  HTTP headers win over meta tags per the CSP spec.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://fonts.gstatic.com https://exercisedb.p.rapidapi.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:* http://127.0.0.1:* https://fit.idone.co.il https://cdn.jsdelivr.net https://storage.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com blob:; worker-src 'self' blob:; child-src 'self' blob:;"
        always;

    # The FastAPI backend under /api/v1 (matches the app's API_BASE_URL).
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    # Serve the built PWA by mounting frontend/dist into the nginx
    # container (e.g. ./nginx/www:/usr/share/nginx/html:ro).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
