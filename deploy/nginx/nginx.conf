# BoostCoach production reverse proxy — routes traffic for fit.idone.co.il.
#
# The 80-server serves the Let's Encrypt ACME challenge and redirects
# everything else to HTTPS. HTTPS is mandatory: Capacitor's WebView requires
# a secure context for the camera API (getUserMedia).

upstream api_upstream {
    server api:8000;
}

# HTTP: ACME challenge + redirect to HTTPS.
server {
    listen 80;
    server_name fit.idone.co.il;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name fit.idone.co.il;

    ssl_certificate     /etc/letsencrypt/live/fit.idone.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.idone.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # The FastAPI backend under /api/v1 (matches the app's API_BASE_URL).
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    # Optional: serve the built PWA here by mounting `frontend/dist` into the
    # nginx container (e.g. ./nginx/www:/usr/share/nginx/html:ro) and adding:
    #   root /usr/share/nginx/html;
    #   try_files $uri /index.html;
    location / {
        return 404;
    }
}
