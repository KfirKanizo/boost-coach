ottom)", "container-margin": "1rem", "stack-gap-md": "1rem" }, "fontFamily": { "display-lg": ["Public Sans"], "body-md": ["Public Sans"], "label-uppercase": ["Public Sans"], "headline-sm": ["Public Sans"], "nav-label": ["Public Sans"] }, "fontSize": { "display-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-uppercase": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "700" }], "nav-label": ["10px", { "lineHeight": "12px", "fontWeight": "500" }] } } } };</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } .pt-safe { padding-top: env(safe-area-inset-top); } }</style></head><body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.1)]"><div class="h-16 flex items-center px-container-margin gap-4"><button class="w-10 h-10 flex items-center justify-center text-on-surface-variant" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><span class="font-headline-sm text-headline-sm text-white">Workout Execution</span></div></header><main class="flex-1 pt-16 bg-surface"><div class="flex flex-col w-full h-[100dvh] bg-surface-ink relative overflow-hidden items-center justify-center p-6">

<!-- Radial Glow Effect -->

      View Summary
    </button>
</div>
<!-- Particle System Canvas -->
<canvas class="absolute inset-0 z-0 pointer-events-none" id="victory-particles"></canvas>
<style>
    @keyframes spring-up {
      0% { transform: scale(0.5) translateY(40px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
<script>
    // Minimal particle system for that extra pop
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('victory-particles');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const particleCount = 40;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.5) * 15 - 5,
          size: Math.random() * 4 + 2,
          life: 1,
          decay: Math.random() * 0.02 + 0.015,
          color: '#39FF14'
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.life > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // gravity
            p.life -= p.decay;

            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Glow effect
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
          }
        });

        if (active) {
          requestAnimationFrame(animate);
        }
      }

      // Delay particles slightly to match spring animation
      setTimeout(() => {
        animate();
      }, 200);
    });
  </script>
</div></main></body></html>
