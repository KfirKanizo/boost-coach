<!-- Environment Toggle -->
<div class="px-4 py-6">
<div class="bg-surface-container-high rounded-full p-1 flex relative w-full max-w-[240px] mx-auto shadow-sm">
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-primary rounded-full transition-transform duration-300" id="env-slider"></div>
<button class="flex-1 py-2 text-sm font-medium z-10 text-on-primary transition-colors" id="btn-home" onclick="toggleEnv('home')">Home</button>
<button class="flex-1 py-2 text-sm font-medium z-10 text-on-surface-variant transition-colors" id="btn-gym" onclick="toggleEnv('gym')">Gym</button>
</div>
</div>
<!-- Energy Map (Horizontal Scroll) -->
<div class="mb-8 pl-4">
<h2 class="text-sm font-bold text-on-surface-variant mb-4 uppercase tracking-wider">Energy Map</h2>
<div class="flex gap-3 overflow-x-auto pb-4 snap-x pr-4" id="energy-map">
<!-- Missed -->
<div class="snap-start flex-shrink-0 w-12 h-12 rounded-full border-2 border-outline-variant flex items-center justify-center opacity-50"></div>
<!-- Completed -->
<div class="snap-start flex-shrink-0 w-12 h-12 rounded-full bg-tertiary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="snap-start flex-shrink-0 w-12 h-12 rounded-full bg-tertiary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<!-- Missed -->
<div class="snap-start flex-shrink-0 w-12 h-12 rounded-full border-2 border-outline-variant flex items-center justify-center opacity-50"></div>
<!-- Completed -->
<div class="snap-start flex-shrink-0 w-12 h-12 rounded-full bg-tertiary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<!-- Today (Pulsing) -->
<div class="snap-start flex-shrink-0 w-12 h-12 rounded-full border-[3px] border-tertiary flex items-center justify-center relative">
<div class="absolute inset-0 bg-tertiary rounded-full animate-ping opacity-20"></div>
<div class="w-8 h-8 rounded-full bg-tertiary flex items-center justify-center">
<span class="material-symbols-outlined text-on-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
</div>
</div>
<!-- Boost Cards -->
<div class="px-4 flex flex-col gap-4 mb-24">
<h2 class="text-sm font-bold text-on-surface-variant mb-2 uppercase tracking-wider">Today's Flow</h2>
<!-- Card 1 -->
<div class="bg-inverse-surface rounded-[24px] p-6 shadow-md relative overflow-hidden flex items-center justify-between group">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/20 rounded-full blur-2xl -mr-16 -mt-16"></div>
<div class="relative z-10 flex flex-col">
<span class="text-on-primary font-bold text-xl mb-1">Dumbbell Thrusters</span>
<div class="flex items-center gap-2 text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[16px]">timer</span>
<span class="">4 sets • 12 reps</span>
</div>
</div>
<button class="relative z-10 w-12 h-12 bg-surface-variant/10 rounded-full flex items-center justify-center text-primary hover:bg-surface-variant/20 transition-colors" onclick="showSwapModal('Dumbbell Thrusters')">
<span class="material-symbols-outlined text-[20px]">swap_horiz</span>
</button>
</div>
<!-- Card 2 -->
<div class="bg-inverse-surface rounded-[24px] p-6 shadow-md relative overflow-hidden flex items-center justify-between group">
<div class="absolute top-0 right-0 w-32 h-32 bg-tertiary/20 rounded-full blur-2xl -mr-16 -mt-16"></div>
<div class="relative z-10 flex flex-col">
<span class="text-on-primary font-bold text-xl mb-1">Renegade Rows</span>
<div class="flex items-center gap-2 text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[16px]">fitness_center</span>
<span class="">3 sets • 10 reps/side</span>
</div>
</div>
<button class="relative z-10 w-12 h-12 bg-surface-variant/10 rounded-full flex items-center justify-center text-primary hover:bg-surface-variant/20 transition-colors" onclick="showSwapModal('Renegade Rows')">
<span class="material-symbols-outlined text-[20px]">swap_horiz</span>
</button>
</div>
<!-- Card 3 -->
<div class="bg-inverse-surface rounded-[24px] p-6 shadow-md relative overflow-hidden flex items-center justify-between group">
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary/20 rounded-full blur-2xl -mr-16 -mt-16"></div>
<div class="relative z-10 flex flex-col">
<span class="text-on-primary font-bold text-xl mb-1">Box Jumps</span>
<div class="flex items-center gap-2 text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[16px]">speed</span>
<span class="">4 sets • 45 sec</span>
</div>
</div>
<button class="relative z-10 w-12 h-12 bg-surface-variant/10 rounded-full flex items-center justify-center text-primary hover:bg-surface-variant/20 transition-colors" onclick="showSwapModal('Box Jumps')">
<span class="material-symbols-outlined text-[20px]">swap_horiz</span>
</button>
</div>
</div>
<!-- Execute FAB -->
<div class="fixed bottom-20 left-0 right-0 px-4 z-40 flex justify-center pointer-events-none">
<button class="bg-[#00E676] text-[#121212] font-black text-xl tracking-widest uppercase rounded-full py-4 px-12 shadow-[0_0_30px_rgba(0,230,118,0.3)] hover:shadow-[0_0_40px_rgba(0,230,118,0.5)] transform active:scale-95 transition-all w-full max-w-sm flex items-center justify-center gap-2 pointer-events-auto">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
      Execute
    </button>
</div>
<!-- Smart Swap Modal (Hidden) -->
<div class="fixed inset-0 z-50 bg-on-surface/50 backdrop-blur-sm hidden flex-col justify-end" id="swap-modal">
<div class="bg-surface rounded-t-[32px] p-6 w-full max-w-md mx-auto transform translate-y-full transition-transform duration-300 shadow-2xl" id="swap-modal-content">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mx-auto mb-6"></div>
<div class="flex items-center justify-between mb-6">
<div>
<h3 class="font-bold text-xl text-on-surface">Smart Swap</h3>
<p class="text-sm text-on-surface-variant mt-1">Replacing <span class="font-bold text-primary" id="swap-target-name"></span></p>
</div>
<button class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center text-on-surface-variant" onclick="hideSwapModal()">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="flex flex-col gap-3">
<!-- Alternative 1 -->
<button class="w-full bg-surface-container flex items-center justify-between p-4 rounded-2xl active:bg-surface-container-high transition-colors text-left" onclick="hideSwapModal()">
<div class="flex flex-col">
<span class="font-bold text-on-surface text-base">Kettlebell Swings</span>
<span class="text-xs text-on-surface-variant mt-1">Similar muscle groups</span>
</div>
<span class="material-symbols-outlined text-primary">add_circle</span>
</button>
<!-- Alternative 2 -->
<button class="w-full bg-surface-container flex items-center justify-between p-4 rounded-2xl active:bg-surface-container-high transition-colors text-left" onclick="hideSwapModal()">
<div class="flex flex-col">
<span class="font-bold text-on-surface text-base">Burpees</span>
<span class="text-xs text-on-surface-variant mt-1">Higher cardio intensity</span>
</div>
<span class="material-symbols-outlined text-primary">add_circle</span>
</button>
</div>
</div>
</div>
</div>
<script>
  function toggleEnv(env) {
    const slider = document.getElementById('env-slider');
    const btnHome = document.getElementById('btn-home');
    const btnGym = document.getElementById('btn-gym');
    
    if (env === 'gym') {
      slider.style.transform = 'translateX(100%)';
      btnGym.classList.replace('text-on-surface-variant', 'text-on-primary');
      btnHome.classList.replace('text-on-primary', 'text-on-surface-variant');
    } else {
      slider.style.transform = 'translateX(0)';
      btnHome.classList.replace('text-on-surface-variant', 'text-on-primary');
      btnGym.classList.replace('text-on-primary', 'text-on-surface-variant');
    }
  }

  function showSwapModal(exerciseName) {
    const modal = document.getElementById('swap-modal');
    const content = document.getElementById('swap-modal-content');
    document.getElementById('swap-target-name').innerText = exerciseName;
    
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    
    // Slight delay to allow display:flex to apply before animating
    setTimeout(() => {
      content.classList.remove('translate-y-full');
    }, 10);
  }

  function hideSwapModal() {
    const modal = document.getElementById('swap-modal');
    const content = document.getElementById('swap-modal-content');
    
    content.classList.add('translate-y-full');
    
    setTimeout(() => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }, 300);
  }

  // Scroll Energy Map to right on load to show "Today"
  document.addEventListener('DOMContentLoaded', () => {
    const map = document.getElementById('energy-map');
    if(map) {
      map.scrollLeft = map.scrollWidth;
    }
  });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-16"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[64px] h-full transition-colors text-primary" data-path="the-flow" href="#"><span class="material-symbols-outlined">home</span><span class="text-[10px] font-medium mt-1">The Flow</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-full text-on-surface-variant transition-colors" data-path="the-coach" href="#"><span class="material-symbols-outlined">forum</span><span class="text-[10px] font-medium mt-1">The Coach</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-full text-on-surface-variant transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined">settings</span><span class="text-[10px] font-medium mt-1">Profile</span></a></div></nav>
