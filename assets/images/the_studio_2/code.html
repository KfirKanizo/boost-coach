<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-primary": "#cfbcff", "surface-container-low": "#f8f2fa", "surface-container-highest": "#e6e0e9", "error-container": "#ffdad6", "surface-tint": "#6750a4", "surface-dim": "#ded8e0", "on-surface": "#1d1b20", "surface-container-high": "#ece6ee", "secondary-fixed-dim": "#cdc0e9", "on-primary-container": "#e0d2ff", "outline": "#7a7582", "surface-container-lowest": "#ffffff", "error": "#ba1a1a", "outline-variant": "#cbc4d2", "surface-container": "#f2ecf4", "primary-container": "#6750a4", "tertiary-fixed-dim": "#e7c365", "tertiary-container": "#c9a74d", "on-primary": "#ffffff", "on-tertiary-container": "#503d00", "on-surface-variant": "#494551", "surface-bright": "#fdf7ff", "primary-fixed": "#e9ddff", "secondary": "#63597c", "on-tertiary-fixed-variant": "#594400", "on-secondary-fixed-variant": "#4b4263", "on-secondary-container": "#645a7d", "on-error-container": "#93000a", "on-error": "#ffffff", "surface-variant": "#e6e0e9", "secondary-fixed": "#e9ddff", "on-tertiary-fixed": "#241a00", "secondary-container": "#e1d4fd", "on-secondary-fixed": "#1f1635", "on-secondary": "#ffffff", "tertiary-fixed": "#ffdf93", "on-background": "#1d1b20", "primary": "#4f378a", "inverse-surface": "#322f35", "on-primary-fixed-variant": "#4f378a", "on-tertiary": "#ffffff", "inverse-on-surface": "#f5eff7", "on-primary-fixed": "#22005d", "background": "#fdf7ff", "primary-fixed-dim": "#cfbcff", "surface": "#fdf7ff", "tertiary": "#765b00" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "fontFamily": { "headline": ["Public Sans"], "display": ["Public Sans"], "body": ["Public Sans"], "label": ["Public Sans"] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body text-on-surface"><main class="min-h-screen"><div class="flex flex-col w-full h-[884px] bg-inverse-surface relative overflow-hidden" id="camera-hud-root">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="First-person view in a modern, well-lit gym setting. Focus on a barbell rack and weight plates in the background. Moody, cinematic lighting with subtle lens flares, indicating a high-end fitness environment. Darkened slightly to act as a background for a heads-up display." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuChe_F_NXUiyHnJxtfqzVP2X7NmaLTllwBQVe9K77W2jhnmYMW8GvwnZUo9qi-slmVWs-6WR0KNI1KmGRM3zxxmPSfG7BjV1zGRZpVsKvtYDvzow1pDxHjp-b9s_epSxaPuHsxNYOOxpluwKrSeKGovPcE782s9doPSWwaxh5spV5mYkIru9wQMu6fZFdNCowoOXWkD04jgrKsuaE5DHeXB89uxcx-IHabCSPcNqGGWrUPz1IDoDxC5Kg')">
<!-- Dark overlay for HUD readability -->
<div class="absolute inset-0 bg-black/40"></div>
</div>
<!-- Massive Countdown Timer -->
<div class="absolute top-12 left-0 right-0 z-10 flex justify-center items-center pointer-events-none drop-shadow-[0_0_15px_rgba(0,0,0,0.5)]">
<span class="text-on-tertiary font-display font-bold tracking-tighter opacity-80 transition-all duration-300" id="countdown-timer" style="font-size: 120px; line-height: 1;">15</span>
</div>
<!-- AR Skeleton Overlay Overlay (Simulated) -->
<div class="absolute inset-0 z-10 pointer-events-none flex justify-center items-center">
<!-- Inline SVG for skeleton lines -->
<svg class="opacity-70" height="100%" preserveaspectratio="xMidYMid slice" viewbox="0 0 400 800" width="100%">
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
<!-- Head -->
<circle cx="200" cy="180" r="30" stroke="#ffffff"></circle>
<!-- Torso -->
<line stroke="#ffffff" x1="200" x2="200" y1="210" y2="400"></line>
<!-- Shoulders -->
<line stroke="#ffffff" x1="140" x2="260" y1="230" y2="230"></line>
<!-- Arms (Left) -->
<line stroke="#ffffff" x1="140" x2="110" y1="230" y2="350"></line>
<!-- Forearm (Left) - Neon Green indicating correct form -->
<line class="drop-shadow-[0_0_8px_rgba(163,230,53,0.8)] animate-pulse" stroke="#a3e635" x1="110" x2="130" y1="350" y2="450"></line>
<!-- Arms (Right) -->
<line stroke="#ffffff" x1="260" x2="290" y1="230" y2="350"></line>
<line stroke="#ffffff" x1="290" x2="270" y1="350" y2="450"></line>
<!-- Hips -->
<line stroke="#ffffff" x1="170" x2="230" y1="400" y2="400"></line>
<!-- Legs (Left) -->
<line stroke="#ffffff" x1="170" x2="150" y1="400" y2="580"></line>
<line stroke="#ffffff" x1="150" x2="160" y1="580" y2="720"></line>
<!-- Legs (Right) -->
<line stroke="#ffffff" x1="230" x2="250" y1="400" y2="580"></line>
<!-- Calf (Right) - Neon Green indicating correct depth -->
<line class="drop-shadow-[0_0_8px_rgba(163,230,53,0.8)] animate-pulse" stroke="#a3e635" x1="250" x2="240" y1="580" y2="720"></line>
<!-- Joint Nodes -->
<circle cx="140" cy="230" fill="#ffffff" r="6"></circle>
<circle cx="260" cy="230" fill="#ffffff" r="6"></circle>
<circle cx="110" cy="350" fill="#ffffff" r="6"></circle>
<circle cx="290" cy="350" fill="#ffffff" r="6"></circle>
<circle cx="170" cy="400" fill="#ffffff" r="6"></circle>
<circle cx="230" cy="400" fill="#ffffff" r="6"></circle>
<circle cx="150" cy="580" fill="#ffffff" r="6"></circle>
<circle cx="250" cy="580" fill="#ffffff" r="6"></circle>
<!-- Highlighted Joint Nodes -->
<circle class="drop-shadow-[0_0_10px_rgba(163,230,53,1)]" cx="130" cy="450" fill="#a3e635" r="8"></circle>
<circle class="drop-shadow-[0_0_10px_rgba(163,230,53,1)]" cx="240" cy="720" fill="#a3e635" r="8"></circle>
</g>
</svg>
</div>
<!-- Real-time Feedback Chips -->
<div class="absolute top-[35%] left-4 z-20 flex flex-col gap-3">
<div class="bg-inverse-surface/80 backdrop-blur-md rounded-full px-4 py-2 flex items-center gap-2 shadow-lg w-max transition-transform duration-300 transform translate-x-0">
<span class="material-symbols-outlined text-tertiary-fixed text-[20px]" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="text-on-inverse-surface text-sm font-semibold tracking-wide">Knees caving</span>
</div>
<div class="bg-[#a3e635]/20 backdrop-blur-md rounded-full px-4 py-2 flex items-center gap-2 shadow-lg w-max transition-transform duration-300 transform translate-x-0">
<span class="material-symbols-outlined text-[#a3e635] text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[#a3e635] text-sm font-semibold tracking-wide">Perfect Depth</span>
</div>
</div>
<!-- Bottom Controls & Stats -->
<div class="absolute bottom-6 left-0 right-0 z-20 px-6 flex flex-col gap-6">
<div class="flex justify-between items-end">
<!-- Rep Counter -->
<div class="flex flex-col">
<span class="text-surface-container-highest text-xs uppercase tracking-widest font-bold mb-1">Reps</span>
<div class="flex items-baseline gap-1 drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]">
<span class="text-on-tertiary text-5xl font-display font-bold">8</span>
<span class="text-outline-variant text-xl">/12</span>
</div>
</div>
<!-- Current Exercise -->
<div class="flex flex-col items-end">
<span class="text-surface-container-highest text-xs uppercase tracking-widest font-bold mb-1">Current</span>
<span class="text-on-tertiary text-lg font-semibold drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]">Back Squat</span>
</div>
</div>
<!-- Actions -->
<div class="flex justify-between items-center w-full">
<button class="w-12 h-12 rounded-full bg-surface/20 backdrop-blur-md flex items-center justify-center text-on-tertiary hover:bg-surface/30 transition-colors shadow-lg active:scale-95">
<span class="material-symbols-outlined">pause</span>
</button>
<button class="px-8 py-3 rounded-full bg-primary text-on-primary font-bold shadow-xl hover:bg-primary/90 transition-all active:scale-95 flex items-center gap-2" id="finish-set-btn">
<span>Finish Set</span>
<span class="material-symbols-outlined text-[20px]">flag</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface/20 backdrop-blur-md flex items-center justify-center text-on-tertiary hover:bg-surface/30 transition-colors shadow-lg active:scale-95">
<span class="material-symbols-outlined">flip_camera_ios</span>
</button>
</div>
</div>
<!-- Progress Bar (Thin Neon Green at very bottom) -->
<div class="absolute bottom-0 left-0 right-0 h-1.5 bg-inverse-surface z-30">
<div class="h-full bg-[#a3e635] drop-shadow-[0_0_8px_rgba(163,230,53,0.8)] rounded-r-full transition-all duration-1000 ease-in-out" style="width: 66%;"></div>
</div>
<!-- Victory State Overlay (Hidden by default) -->
<div class="absolute inset-0 z-50 bg-inverse-surface/90 backdrop-blur-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500" id="victory-overlay">
<div class="relative flex items-center justify-center mb-8">
<!-- Glow effect behind checkmark -->
<div class="absolute w-48 h-48 bg-[#a3e635] rounded-full blur-3xl opacity-30 animate-pulse"></div>
<!-- Massive Checkmark -->
<div class="w-32 h-32 rounded-full bg-[#a3e635]/10 flex items-center justify-center scale-50 transition-transform duration-[800ms] cubic-bezier(0.34, 1.56, 0.64, 1)" id="victory-check">
<span class="material-symbols-outlined text-[#a3e635] drop-shadow-[0_0_15px_rgba(163,230,53,1)]" style="font-size: 80px; font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<h2 class="text-on-inverse-surface font-display text-4xl font-bold mb-2 tracking-tight">Set Complete!</h2>
<p class="text-surface-container-highest text-lg mb-8">12 Reps • Great form</p>
<div class="flex gap-4">
<button class="px-6 py-3 rounded-full bg-surface/20 text-on-inverse-surface font-semibold hover:bg-surface/30 transition-colors">Review Form</button>
<button class="px-6 py-3 rounded-full bg-[#a3e635] text-on-surface font-bold shadow-[0_0_15px_rgba(163,230,53,0.4)] hover:bg-[#a3e635]/90 transition-colors">Next Exercise</button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Simulate countdown timer
      const timerElement = document.getElementById('countdown-timer');
      let timeLeft = 15;
      
      const timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) {
          timerElement.textContent = timeLeft;
          // Add a subtle pulse to the number
          timerElement.classList.add('scale-110');
          setTimeout(() => {
            timerElement.classList.remove('scale-110');
          }, 150);
        } else {
          clearInterval(timerInterval);
        }
      }, 1000);

      // Handle Victory State trigger
      const finishBtn = document.getElementById('finish-set-btn');
      const victoryOverlay = document.getElementById('victory-overlay');
      const victoryCheck = document.getElementById('victory-check');

      finishBtn.addEventListener('click', () => {
        // Show overlay
        victoryOverlay.classList.remove('opacity-0', 'pointer-events-none');
        victoryOverlay.classList.add('opacity-100');
        
        // Bounce in checkmark
        setTimeout(() => {
          victoryCheck.classList.remove('scale-50');
          victoryCheck.classList.add('scale-100');
        }, 100);
      });
    });
  </script>
</div></main></body></html>
