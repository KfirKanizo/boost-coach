behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-[#121212] font-body text-[#FFFFFF]"><header class="fixed top-0 w-full z-50 pt-safe bg-[#121212]/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.5)]"><div class="h-16 px-4 flex items-center justify-between"><div class="flex items-center gap-2"><img alt="BoostCoach Logo" class="h-8 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsSwl2ujP730YEzDyugNnZYEAb3vu7CES39-ucl8xuhVn_6eYr3RYHwmtcc-0G1Olk7JATyniaZoACr6y1X92j8Cw5UHzh2mRVVhQMPUXjSE21Fm_raQRfktQbZyk6yqBw187Hkfv7--Q1wojYPYx2aKhpZn482K3AsoAhLBmV9vr-7-3BuhbxmzrZtB0vp5dpy0g0HPRzxtxTxWKWYeKgjmwK4zQugNb8xp82S_LMxPoGylrct0Er7w"/></div><div class="w-8 h-8 rounded-full bg-[#1E1E1E] flex items-center justify-center"><span class="material-symbols-outlined text-[#FFFFFF] text-[18px]">person</span></div></div></header><main class="min-h-screen pt-16 bg-[#121212]"><div class="flex flex-col w-full h-full relative overflow-hidden z-50 transition-opacity duration-300" id="smart-swap-overlay">

<div class="w-12 h-12 rounded-xl bg-[#121212] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#00E676] text-2xl group-hover:scale-110 transition-transform">fitness_center</span>

</button>
<button class="w-full bg-[#1E1E1E] border border-[#333333] hover:bg-[#2A2A2A] flex items-center p-4 rounded-2xl gap-4 transition-all duration-200 active:scale-[0.98] group shadow-sm">
<div class="w-12 h-12 rounded-xl bg-[#121212] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#00E676] text-2xl group-hover:scale-110 transition-transform">healing</span>
</div>

</div>
<div class="w-8 h-8 rounded-full bg-[#121212] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity transform -translate-x-4 group-hover:translate-x-0 duration-300">

</div>
</button>

</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const sheet = document.getElementById('smart-swap-sheet');
    const overlay = document.getElementById('smart-swap-overlay');
    const backdrop = document.getElementById('smart-swap-backdrop');
    const cancelBtn = document.getElementById('smart-swap-cancel');
    const handleContainer = document.getElementById('smart-swap-handle-container');
    
    // Trigger entrance animation
    setTimeout(() => {
      sheet.classList.remove('translate-y-full');
    }, 50);

    const closeSheet = () => {
      sheet.classList.add('translate-y-full');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        // In a real app, this would remove the node or trigger routing
        // overlay.style.display = 'none';
      }, 300);
    };

    backdrop.addEventListener('click', closeSheet);
    cancelBtn.addEventListener('click', closeSheet);

    // Simple swipe down to close
    let startY = 0;
    let currentY = 0;
    
    handleContainer.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      sheet.style.transition = 'none';
    }, { passive: true });

    handleContainer.addEventListener('touchmove', (e) => {
      currentY = e.touches[0].clientY;
      const diff = currentY - startY;
      if (diff > 0) {
        sheet.style.transform = `translateY(${diff}px)`;
      }
    }, { passive: true });

    handleContainer.addEventListener('touchend', (e) => {
      sheet.style.transition = 'transform 0.4s ease-out';
      const diff = currentY - startY;
      if (diff > 100) {
        closeSheet();
      } else {
        sheet.style.transform = '';
      }
    });
  });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-[#121212]/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.5)]" data-active-classes="text-[#00E676]"><div class="flex justify-around items-center h-16"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[64px] h-full transition-colors text-[#00E676]" data-path="the-flow" href="#"><span class="material-symbols-outlined">home</span><span class="text-[10px] font-medium mt-1">The Flow</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-full text-[#FFFFFF] transition-colors" data-path="the-coach" href="#"><span class="material-symbols-outlined">forum</span><span class="text-[10px] font-medium mt-1">The Coach</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-full text-[#FFFFFF] transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined">settings</span><span class="text-[10px] font-medium mt-1">Profile</span></a></div></nav>
